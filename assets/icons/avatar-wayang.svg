<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="avatarBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F8F2E3"/>
      <stop offset="85%" stop-color="#E5D9BB"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </radialGradient>
    <clipPath id="avatarClip">
      <circle cx="50" cy="50" r="48"/>
    </clipPath>
  </defs>
  <!-- Circle Base -->
  <circle cx="50" cy="50" r="48" fill="url(#avatarBg)" stroke="#8B5A2B" stroke-width="2.5"/>
  <g clip-path="url(#avatarClip)">
    <!-- Clothes / Surjan Lurik -->
    <path d="M20,95 Q50,75 80,95 L80,105 L20,105 Z" fill="#2E4A3B"/>
    <path d="M35,100 L35,84 M45,100 L45,80 M55,100 L55,80 M65,100 L65,84" stroke="#C9A227" stroke-width="1.5"/>
    <path d="M43,80 L50,88 L57,80 Z" fill="#E8C766"/>
    <!-- Neck -->
    <rect x="44" y="65" width="12" height="16" fill="#D2996E" rx="3"/>
    <!-- Head -->
    <ellipse cx="50" cy="52" rx="19" ry="22" fill="#E0A77D"/>
    <!-- Face Features -->
    <ellipse cx="43" cy="52" rx="2" ry="2.5" fill="#2B2116"/>
    <ellipse cx="57" cy="52" rx="2" ry="2.5" fill="#2B2116"/>
    <path d="M48,53 L49,58 L52,58" fill="none" stroke="#B8784F" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M45,63 Q50,67 55,63" fill="none" stroke="#8B4513" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M39,46 Q44,43 47,45" fill="none" stroke="#3A2412" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M53,45 Q56,43 61,46" fill="none" stroke="#3A2412" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Blangkon (Javanese Headdress) -->
    <path d="M30,44 C30,26 40,22 50,22 C60,22 70,26 70,44 C65,40 58,38 50,38 C42,38 35,40 30,44 Z" fill="#5C381E"/>
    <!-- Blangkon front wrap / wiron -->
    <path d="M31,44 Q50,38 69,44 Q50,42 31,44 Z" fill="#8B5A2B"/>
    <!-- Mondholan (back bun of blangkon) -->
    <ellipse cx="68" cy="46" rx="6" ry="6" fill="#442812"/>
    <!-- Ear & Sumping -->
    <ellipse cx="31" cy="54" rx="2.5" ry="4" fill="#D2996E"/>
    <ellipse cx="69" cy="54" rx="2.5" ry="4" fill="#D2996E"/>
  </g>
</svg>
